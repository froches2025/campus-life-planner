<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/main.css">
    <title>Campus Life Planner</title>
</head>
<body>
    <a href="#main" class="skip-link">Skip to main content</a>
    <header>
        <h1>Campus Life Planner</h1>
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#dashboard">Dashboard</a></li>
                <li><a href="#records">Records</a></li>
                <li><a href="#add-task">Add Task</a></li>
                <li><a href="#settings">Settings</a></li>
            </ul>
        </nav>
    </header>
    <main id="main">
        <section id="about" aria-labelledby="about-heading">
            <h2 id="about-heading">About</h2>
        </section>
        <section id="dashboard" aria-labelledby="dashboard-heading">
            <h2 id="dashboard-heading">Dashboard</h2>
        </section>
        <section id="records" aria-labelledby="records-heading">
            <h2 id="records-heading">Records</h2>
        </section>
        <section id="add-task" aria-labelledby="add-task-heading">
            <h2 id="add-task-heading">Add Task</h2>
            <form id="task-form" novalidate>
                <div class="form-group">
                    <label for="task-title">Title</label>
                    <input
                        type="text"
                        id="task-title"
                        name="title"
                        aria-invalid="false"
                        aria-describedby="task-title-error"
                        required
                    />
                    <span id="task-title-error" aria-live="assertive" role="alert"></span>
                </div>

                <div class="form-group">
                    <label for="task-due-date">Due Date</label>
                    <input
                        type="text"
                        id="task-due-date"
                        name="dueDate"
                        placeholder="YYYY-MM-DD"
                        aria-invalid="false"
                        aria-describedby="task-due-date-error"
                        required
                    />
                    <span id="task-due-date-error" aria-live="assertive" role="alert"></span>
                </div>

                <div class="form-group">
                    <label for="task-duration">Duration</label>
                    <input
                        type="text"
                        id="task-duration"
                        name="duration"
                        placeholder="minutes"
                        aria-invalid="false"
                        aria-describedby="task-duration-error"
                        required
                    />
                    <span id="task-duration-error" aria-live="assertive" role="alert"></span>
                </div>

                <div class="form-group">
                    <label for="task-tag">Tag</label>
                    <input
                        type="text"
                        id="task-tag"
                        name="tag"
                        list="tag-suggestions"
                        aria-invalid="false"
                        aria-describedby="task-tag-error"
                        required
                    />
                    <datalist id="tag-suggestions">
                        <option value="Academics"></option>
                        <option value="Social"></option>
                        <option value="Health"></option>
                        <option value="Personal"></option>
                        <option value="Club"></option>
                        <option value="Other"></option>
                    </datalist>
                    <span id="task-tag-error" aria-live="assertive" role="alert"></span>
                </div>

                <span id="form-announcement" class="form-message" aria-live="polite" aria-atomic="true"></span>

                <button type="submit">Submit</button>
                <button type="button" id="cancel-btn" hidden>Cancel</button>
            </form>
        </section>
        <section id="settings" aria-labelledby="settings-heading">
            <h2 id="settings-heading">Settings</h2>
        </section>
    </main>
    <footer>
        <p>Froches</p>
        <a href="https://github.com/froches2025" rel="noopener noreferrer">My Github</a>
    </footer>
    <script type="module" src="scripts/main.js"></script>
</body>
</html>
